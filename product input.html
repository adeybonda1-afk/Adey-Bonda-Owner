<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adey Bonda · Add Product</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      padding: 24px 16px 50px 16px;
      display: flex;
      justify-content: center;
    }
    .card {
      max-width: 720px;
      width: 100%;
      background: white;
      border-radius: 32px;
      padding: 28px 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      transition: 0.2s;
    }
    h2 {
      font-weight: 600;
      font-size: 1.9rem;
      letter-spacing: -0.3px;
      color: #0b2a3b;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 3px solid #e6edf4;
      padding-bottom: 16px;
    }
    h2 small {
      font-size: 1rem;
      font-weight: 400;
      color: #3e6b8c;
      margin-left: auto;
      background: #eef4fa;
      padding: 4px 14px;
      border-radius: 30px;
    }
    h3 {
      font-weight: 500;
      font-size: 1.2rem;
      color: #1e405a;
      margin: 20px 0 12px 0;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      margin: 12px 0 16px 0;
      background: #f1f6fb;
      padding: 16px 12px;
      border-radius: 24px;
      border: 1px solid #dde6ef;
      min-height: 130px;
    }
    #gallery img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      border: 3px solid transparent;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: 0.15s ease;
      cursor: pointer;
    }
    #gallery img:hover {
      transform: scale(1.02);
      border-color: #8bb3d0;
    }
    .selected {
      border: 4px solid #1f7b9e !important;
      box-shadow: 0 0 0 2px white, 0 0 0 6px #1f7b9e30;
    }
    .field-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 14px 0 6px;
    }
    .row-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    input, select, button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d0dde9;
      border-radius: 20px;
      font-size: 0.95rem;
      background: white;
      transition: 0.15s;
      font-family: inherit;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #1f7b9e;
      box-shadow: 0 0 0 3px #1f7b9e25;
    }
    .radio-group {
      display: flex;
      gap: 28px;
      align-items: center;
      background: #f2f7fd;
      padding: 8px 18px;
      border-radius: 40px;
      margin: 6px 0 4px;
      border: 1px solid #d7e2ef;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 450;
      color: #1f405a;
      cursor: pointer;
    }
    .radio-group input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #1f7b9e;
      margin: 0;
    }
    #quantity {
      display: none;
      margin-top: 4px;
    }
    #quantity.show {
      display: block;
    }
    button {
      background: #1f7b9e;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      border: none;
      padding: 14px;
      border-radius: 40px;
      margin-top: 18px;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(31, 123, 158, 0.2);
    }
    button:hover {
      background: #14607e;
      transform: scale(1.01);
      box-shadow: 0 8px 18px rgba(31, 123, 158, 0.25);
    }
    .hint {
      font-size: 0.8rem;
      color: #4a6f8c;
      margin: 2px 0 8px 6px;
      opacity: 0.8;
    }
    .divider {
      margin: 16px 0 6px;
      border-top: 1px solid #e2ebf3;
    }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.08);
            border-top: 1px solid #eef5fb;
            z-index: 100;
        }

        nav a {
            color: #6f8fa8;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 8px 20px;
            border-radius: 30px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav a.current {
            background: #1f7b9e;
            color: white;
            box-shadow: 0 4px 12px rgba(31,123,158,0.25);
        }

        nav a:hover:not(.current) {
            background: #f0f6fd;
            color: #1f5a7a;
        }    

    @media (max-width: 480px) {
      .row-duo {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="card">
  <h2>🛍️ Adey Bonda <small>add product</small></h2>

  <h3>📸 Select images</h3>
  <div id="gallery"></div>
  <div class="hint">↳ click to select / deselect (max 5 recommended)</div>

  <div class="field-grid">
    <input id="name" placeholder="Product name *" value="">

    <div class="row-duo">
      <input id="price" type="number" placeholder="Price (ETB)" step="0.01">
      <input id="size" placeholder="Size (e.g. M, 42, One size)">
    </div>

    <div class="radio-group">
      <label><input type="radio" name="qtyType" value="one" checked> One</label>
      <label><input type="radio" name="qtyType" value="multiple"> Multiple</label>
    </div>
    <input id="quantity" type="number" placeholder="How many? (stock)">

    <div class="row-duo">
      <select id="type">
        <option value="Shoes">Shoes</option>
        <option value="T-Shirt">T-Shirt</option>
        <option value="Sweater">Sweater</option>
        <option value="Pants">Pants</option>
        <option value="Other">Other</option>
      </select>
      <select id="gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Unisex">Unisex</option>
      </select>
    </div>
    <input id="brand" placeholder="Brand (optional)">
  </div>

  <button id="doneBtn">✓ Add product</button>
  <div style="margin-top: 10px; font-size:0.8rem; color:#306f92; text-align:center;">All fields are saved to Firebase · Adey Bonda</div>
</div>

    <nav>
        <a href="home.html" ><i class="fas fa-home"></i> Home</a>
        <a href="message.html"><i class="fas fa-comment-dots"></i> Message</a>
        <a href="analysis.html"><i class="fas fa-chart-bar"></i> Analysis</a>
        <a href="product input.html" class="current"><i class="fas fa-cog"></i> Product Input </a>
    </nav>

<script type="module">
  // ----- Firebase & Drive config -----
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpLcSFmn1gNTklHu2eiebDYtXpq0qIhlM",
    authDomain: "adey-bonda.firebaseapp.com",
    projectId: "adey-bonda",
    storageBucket: "adey-bonda.firebasestorage.app",
    messagingSenderId: "820555835547",
    appId: "1:820555835547:web:efc14ad017ab4d206f7e3e"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  const DRIVE_API_KEY = "AIzaSyAh41ifWIw442I30oVF2GleJsPdKYbXDU4";
  const FOLDER_ID = "1jFxWcF-2E_jdBLZOdBwL5bXUP-YrCmqS";

  // ----- DOM refs -----
  const gallery = document.getElementById("gallery");
  const nameInput = document.getElementById("name");
  const priceInput = document.getElementById("price");
  const sizeInput = document.getElementById("size");
  const typeSelect = document.getElementById("type");
  const genderSelect = document.getElementById("gender");
  const brandInput = document.getElementById("brand");
  const quantityInput = document.getElementById("quantity");
  const doneBtn = document.getElementById("doneBtn");

  const selectedImages = []; // stores file IDs

  // ----- load images from Google Drive -----
  async function loadImages() {
    try {
      const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'image/'&fields=files(id,name)&key=${DRIVE_API_KEY}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("Drive fetch failed");
      const data = await response.json();

      if (!data.files || data.files.length === 0) {
        gallery.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#4d7a9a; padding:20px;">📂 No images found in folder</div>`;
        return;
      }

      data.files.forEach(file => {
        const img = document.createElement("img");
        img.src = `https://lh3.googleusercontent.com/d/${file.id}`;
        img.alt = file.name || "product";
        img.loading = "lazy";

        img.addEventListener("click", () => {
          img.classList.toggle("selected");
          const id = file.id;
          if (selectedImages.includes(id)) {
            const idx = selectedImages.indexOf(id);
            if (idx !== -1) selectedImages.splice(idx, 1);
          } else {
            selectedImages.push(id);
          }
          // optional: visual counter
        });

        gallery.appendChild(img);
      });
    } catch (err) {
      console.warn("Drive load error:", err);
      gallery.innerHTML = `<div style="grid-column:1/-1; color:#b33; padding:12px;">⚠️ Could not load images. Check Drive folder & API key.</div>`;
    }
  }
  loadImages();

  // ----- toggle quantity field -----
  const qtyRadios = document.querySelectorAll("[name=qtyType]");
  qtyRadios.forEach(r => {
    r.addEventListener("change", () => {
      const show = document.querySelector("[name=qtyType]:checked")?.value === "multiple";
      quantityInput.classList.toggle("show", show);
      if (!show) {
        quantityInput.value = "";
        quantityInput.style.display = "none";
      } else {
        quantityInput.style.display = "block";
      }
    });
  });
  // initial state (One selected)
  quantityInput.style.display = "none";

  // ----- DONE: push to Firebase -----
  doneBtn.addEventListener("click", async () => {
    // basic validation
    const name = nameInput.value.trim();
    const price = priceInput.value.trim();
    if (!name) { alert("Please enter a product name."); return; }
    if (!price || isNaN(Number(price))) { alert("Please enter a valid price."); return; }
    if (selectedImages.length === 0) { alert("Please select at least one image."); return; }

    const qtyType = document.querySelector("[name=qtyType]:checked")?.value || "one";
    const qtyValue = (qtyType === "multiple") ? quantityInput.value.trim() : "1";
    if (qtyType === "multiple" && (!qtyValue || isNaN(Number(qtyValue)) || Number(qtyValue) < 0)) {
      alert("Please enter a valid stock quantity (number).");
      return;
    }

    const product = {
      productinformation: {
        images: selectedImages.join(","),
        name: name,
        price: price,
        quantityType: qtyType,
        quantity: qtyType === "multiple" ? qtyValue : "1",
        size: sizeInput.value.trim() || "N/A",
        type: typeSelect.value,
        brand: brandInput.value.trim() || "unbranded",
        gender: genderSelect.value,
        timestamp: new Date().toISOString()
      }
    };

    try {
      const productRef = push(ref(database, "AdeyBonda/products"));
      await set(productRef, product);
      alert("✅ Product added successfully!");
      location.reload();
    } catch (err) {
      console.error("Firebase error:", err);
      alert("❌ Error saving product. Check console.");
    }
  });
</script>
</body>
</html>
