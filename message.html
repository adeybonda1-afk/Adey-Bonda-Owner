<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages · Adey Bonda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Header */
        header {
            background: white;
            padding: 20px 24px;
            border-bottom: 1px solid #eef5fb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        header h2 {
            color: #0b2a3b;
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h2 i {
            color: #1f7b9e;
            font-size: 1.8rem;
        }

        .header-badge {
            background: #e1edf7;
            color: #1f5a7a;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Search Bar */
        .search-container {
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #eef5fb;
            position: sticky;
            top: 76px;
            z-index: 49;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: #f4f7fc;
            border-radius: 30px;
            padding: 4px 4px 4px 20px;
            border: 1px solid #e2eaf1;
            transition: 0.2s;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-wrapper:focus-within {
            border-color: #1f7b9e;
            box-shadow: 0 0 0 4px rgba(31,123,158,0.1);
            background: white;
        }

        .search-wrapper i {
            color: #6f8fa8;
            font-size: 1rem;
        }

        .search-wrapper input {
            border: none;
            padding: 12px 12px;
            font-size: 0.95rem;
            width: 100%;
            background: transparent;
            outline: none;
            font-family: inherit;
            color: #0b2a3b;
        }

        .search-wrapper input::placeholder {
            color: #a8bccf;
        }

        .search-wrapper button {
            background: #1f7b9e;
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .search-wrapper button:hover {
            background: #14607e;
            transform: scale(1.02);
        }

        /* Messages List */
        .messages-container {
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .message-item {
            background: white;
            padding: 16px 20px;
            border-radius: 20px;
            border: 1px solid #e7eef6;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.2s;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            position: relative;
        }

        .message-item:hover {
            border-color: #cbddee;
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        }

        .message-item.unread {
            border-left: 4px solid #1f7b9e;
            background: #f8fbff;
        }

        .message-item.unread .message-name {
            font-weight: 700;
            color: #0b2a3b;
        }

        .message-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1f7b9e, #14607e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message-avatar .avatar-placeholder {
            font-size: 1.6rem;
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .message-name {
            font-weight: 600;
            color: #0b2a3b;
            font-size: 1rem;
        }

        .message-time {
            font-size: 0.75rem;
            color: #8aaec9;
            white-space: nowrap;
            margin-left: 8px;
        }

        .message-preview {
            font-size: 0.9rem;
            color: #6f8fa8;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-preview i {
            font-size: 0.7rem;
            color: #1f7b9e;
        }

        .message-preview .no-message {
            color: #a8bccf;
            font-style: italic;
        }

        .message-unread-badge {
            background: #1f7b9e;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
            border: 1px dashed #d6e1ed;
            color: #6f8fa8;
        }

        .empty-state i {
            font-size: 3rem;
            opacity: 0.4;
            margin-bottom: 12px;
        }

        .empty-state .empty-sub {
            font-size: 0.9rem;
            margin-top: 4px;
            color: #a8bccf;
        }

        /* Loading */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #6f8fa8;
        }

        .loading-state i {
            font-size: 2.5rem;
            animation: spin 1s linear infinite;
            color: #1f7b9e;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Navigation */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.08);
            border-top: 1px solid #eef5fb;
            z-index: 100;
        }

        nav a {
            color: #6f8fa8;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 8px 20px;
            border-radius: 30px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav a.current {
            background: #1f7b9e;
            color: white;
            box-shadow: 0 4px 12px rgba(31,123,158,0.25);
        }

        nav a:hover:not(.current) {
            background: #f0f6fd;
            color: #1f5a7a;
        }

        /* Responsive */
        @media (max-width: 640px) {
            header {
                padding: 16px;
            }
            header h2 {
                font-size: 1.3rem;
            }
            .search-container {
                padding: 12px 16px;
                top: 68px;
            }
            .search-wrapper {
                padding: 2px 2px 2px 16px;
            }
            .search-wrapper input {
                padding: 10px 10px;
                font-size: 0.9rem;
            }
            .search-wrapper button {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
            .messages-container {
                padding: 12px 16px;
            }
            .message-item {
                padding: 12px 16px;
                gap: 12px;
            }
            .message-avatar {
                width: 48px;
                height: 48px;
                font-size: 1.2rem;
            }
            .message-name {
                font-size: 0.95rem;
            }
            .message-preview {
                font-size: 0.85rem;
            }
            nav a {
                font-size: 0.8rem;
                padding: 6px 14px;
            }
        }

        @media (max-width: 400px) {
            .message-top {
                flex-wrap: wrap;
                gap: 4px;
            }
            .message-time {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2><i class="fas fa-comments"></i> Adey Bonda</h2>
        <span class="header-badge"><i class="fas fa-crown"></i> Owner</span>
    </header>

    <!-- Search -->
    <div class="search-container">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search conversations..." />
            <button id="searchBtn"><i class="fas fa-arrow-right"></i> Find</button>
        </div>
    </div>

    <!-- Messages -->
    <div class="messages-container" id="messagesContainer">
        <div class="loading-state">
            <i class="fas fa-spinner"></i>
            <div style="margin-top: 12px;">Loading conversations...</div>
        </div>
    </div>

    <!-- Navigation -->
    <nav>
        <a href="home.html"><i class="fas fa-home"></i> Home</a>
        <a href="message.html" class="current"><i class="fas fa-comment-dots"></i> Message</a>
        <a href="analysis.html"><i class="fas fa-chart-bar"></i> Analysis</a>
        <a href="control.html"><i class="fas fa-cog"></i> Control</a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpLcSFmn1gNTklHu2eiebDYtXpq0qIhlM",
            authDomain: "adey-bonda.firebaseapp.com",
            projectId: "adey-bonda",
            storageBucket: "adey-bonda.firebasestorage.app",
            messagingSenderId: "820555835547",
            appId: "1:820555835547:web:efc14ad017ab4d206f7e3e"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const messagesContainer = document.getElementById('messagesContainer');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        let allConversations = [];
        let searchQuery = '';

        // Get user initial
        function getUserInitial(name) {
            if (!name) return '?';
            return name.charAt(0).toUpperCase();
        }

        // Get time ago
        function getTimeAgo(timestamp) {
            if (!timestamp) return '';
            const now = Date.now();
            const diff = now - timestamp;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            return new Date(timestamp).toLocaleDateString();
        }

        // Load conversations
        function loadConversations() {
            const messagesRef = ref(database, 'AdeyBonda/messages');
            
            onValue(messagesRef, async (snapshot) => {
                const data = snapshot.val();
                
                if (!data) {
                    messagesContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-comment-slash"></i>
                            <div>No conversations yet</div>
                            <div class="empty-sub">When users message you, they'll appear here</div>
                        </div>
                    `;
                    return;
                }

                const userIds = Object.keys(data);
                allConversations = [];

                // Show loading
                messagesContainer.innerHTML = `
                    <div class="loading-state">
                        <i class="fas fa-spinner"></i>
                        <div style="margin-top: 12px;">Loading conversations...</div>
                    </div>
                `;

                // Load each user's conversation
                for (const userId of userIds) {
                    try {
                        // Get user info
                        const userRef = ref(database, `AdeyBonda/users/${userId}`);
                        const userSnap = await get(userRef);
                        const userData = userSnap.val() || {};

                        // Get last message
                        const lastMsgRef = ref(database, `AdeyBonda/messages/${userId}/lastMessage`);
                        const lastMsgSnap = await get(lastMsgRef);
                        const lastMsg = lastMsgSnap.val() || null;

                        // Get unread count
                        const messagesRef_user = ref(database, `AdeyBonda/messages/${userId}`);
                        const messagesSnap = await get(messagesRef_user);
                        const messagesData = messagesSnap.val() || {};
                        
                        let unreadCount = 0;
                        if (messagesData && typeof messagesData === 'object') {
                            // Count messages where seen is false and from is not the owner
                            const msgKeys = Object.keys(messagesData);
                            for (const key of msgKeys) {
                                const msg = messagesData[key];
                                if (msg && msg.from === userId && msg.seen === false) {
                                    unreadCount++;
                                }
                            }
                        }

                        allConversations.push({
                            userId: userId,
                            name: userData.name || 'Unknown User',
                            phoneNumber: userData.phoneNumber || '',
                            lastMessage: lastMsg ? lastMsg.message : null,
                            lastMessageTime: lastMsg ? lastMsg.time : null,
                            unreadCount: unreadCount
                        });

                    } catch (error) {
                        console.error('Error loading conversation:', error);
                    }
                }

                // Sort by last message time (newest first)
                allConversations.sort((a, b) => {
                    const timeA = a.lastMessageTime || 0;
                    const timeB = b.lastMessageTime || 0;
                    return timeB - timeA;
                });

                renderConversations();

            }, (error) => {
                console.error('Error loading messages:', error);
                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <div>Error loading conversations</div>
                        <div class="empty-sub">Please try again later</div>
                    </div>
                `;
            });
        }

        // Render conversations
        function renderConversations() {
            let filtered = allConversations;

            // Apply search
            if (searchQuery) {
                const query = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(conv => 
                    conv.name.toLowerCase().includes(query) ||
                    (conv.lastMessage && conv.lastMessage.toLowerCase().includes(query))
                );
            }

            if (filtered.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <div>No conversations found</div>
                        <div class="empty-sub">Try adjusting your search</div>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(conv => {
                const initial = getUserInitial(conv.name);
                const timeAgo = getTimeAgo(conv.lastMessageTime);
                const isUnread = conv.unreadCount > 0;
                const hasMessage = conv.lastMessage !== null && conv.lastMessage !== '';

                html += `
                    <div class="message-item ${isUnread ? 'unread' : ''}" data-userid="${conv.userId}">
                        <div class="message-avatar">
                            ${initial !== '?' ? initial : '<i class="fas fa-user avatar-placeholder"></i>'}
                        </div>
                        <div class="message-content">
                            <div class="message-top">
                                <span class="message-name">${conv.name}</span>
                                ${timeAgo ? `<span class="message-time">${timeAgo}</span>` : ''}
                            </div>
                            <div class="message-preview">
                                ${hasMessage ? 
                                    `<i class="fas fa-reply"></i> ${conv.lastMessage}` :
                                    '<span class="no-message">No messages yet</span>'
                                }
                            </div>
                        </div>
                        ${isUnread ? `<span class="message-unread-badge">${conv.unreadCount}</span>` : ''}
                    </div>
                `;
            });

            messagesContainer.innerHTML = html;

            // Add click listeners
            document.querySelectorAll('.message-item').forEach(item => {
                item.addEventListener('click', () => {
                    const userId = item.dataset.userid;
                    sessionStorage.setItem('chatUserId', userId);
                    window.location.href = 'chat-detail.html';
                });
            });
        }

        // Search functionality
        function performSearch() {
            searchQuery = searchInput.value;
            renderConversations();
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Initialize
        loadConversations();
    </script>
</body>
</html>
