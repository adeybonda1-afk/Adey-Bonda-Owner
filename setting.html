<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings · Adey Bonda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f4f7fc 0%, #e8f0f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #0b2a3b;
        }

        .settings-container {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 32px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid #e7eef6;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            border-radius: 22px;
            background: linear-gradient(135deg, #1f7b9e, #14607e);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 8px 24px rgba(31,123,158,0.25);
        }

        .header h1 {
            font-size: 1.7rem;
            margin-bottom: 5px;
        }

        .header p {
            color: #6f8fa8;
            font-size: .92rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: .86rem;
            font-weight: 700;
            color: #1d4058;
            margin-bottom: 7px;
        }

        label i {
            color: #1f7b9e;
            width: 18px;
            margin-right: 5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8aaec9;
        }

        input {
            width: 100%;
            padding: 14px 48px 14px 46px;
            border: 2px solid #d6e1ed;
            border-radius: 15px;
            background: #fafcfe;
            color: #0b2a3b;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: .2s;
        }

        input:focus {
            border-color: #1f7b9e;
            background: white;
            box-shadow: 0 0 0 4px rgba(31,123,158,.1);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #8aaec9;
            cursor: pointer;
            font-size: 1rem;
            padding: 8px;
        }

        .toggle-password:hover {
            color: #1f7b9e;
        }

        .save-btn {
            width: 100%;
            border: 0;
            border-radius: 15px;
            padding: 15px;
            margin-top: 4px;
            background: linear-gradient(135deg, #1f7b9e, #14607e);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(31,123,158,.3);
            transition: .2s;
        }

        .save-btn:hover {
            transform: translateY(-2px);
        }

        .save-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .save-btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        .save-btn.loading .spinner {
            display: inline-block;
        }

        .save-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 13px 15px;
            border-radius: 12px;
            font-size: .9rem;
            align-items: center;
            gap: 10px;
        }

        .message.show {
            display: flex;
        }

        .message.success {
            background: #e8f8ef;
            border: 1px solid #c8edd8;
            color: #19703d;
        }

        .message.error {
            background: #fee8e8;
            border: 1px solid #fdd0d0;
            color: #c0392b;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #1f7b9e;
            text-decoration: none;
            font-weight: 600;
            font-size: .9rem;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .info {
            margin-top: 22px;
            padding: 13px 15px;
            border-radius: 13px;
            background: #f4f8fb;
            color: #6f8fa8;
            font-size: .82rem;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .settings-container {
                padding: 26px 20px;
                border-radius: 26px;
            }
        }
    </style>
</head>
<body>

<div class="settings-container">
    <div class="header">
        <div class="logo">
            <i class="fas fa-store-alt"></i>
        </div>
        <h1>Owner Settings</h1>
        <p>Change your owner login credentials</p>
    </div>

    <form id="settingsForm" autocomplete="off">
        <div class="form-group">
            <label for="idInput">
                <i class="fas fa-id-card"></i> New Owner ID
            </label>
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input
                    id="idInput"
                    type="number"
                    inputmode="numeric"
                    placeholder="Enter new owner ID"
                    required
                >
            </div>
        </div>

        <div class="form-group">
            <label for="passwordInput">
                <i class="fas fa-lock"></i> New Password
            </label>
            <div class="input-wrapper">
                <i class="fas fa-key"></i>
                <input
                    id="passwordInput"
                    type="password"
                    placeholder="Enter new password"
                    required
                >
                <button type="button" class="toggle-password" data-target="passwordInput">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPasswordInput">
                <i class="fas fa-check-circle"></i> Confirm New Password
            </label>
            <div class="input-wrapper">
                <i class="fas fa-key"></i>
                <input
                    id="confirmPasswordInput"
                    type="password"
                    placeholder="Enter password again"
                    required
                >
                <button type="button" class="toggle-password" data-target="confirmPasswordInput">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" id="saveBtn" class="save-btn">
            <span class="btn-text"><i class="fas fa-save"></i> Save Changes</span>
            <span class="spinner"></span>
        </button>
    </form>

    <div id="message" class="message">
        <i id="messageIcon"></i>
        <span id="messageText"></span>
    </div>

    <a href="home.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="info">
        <i class="fas fa-info-circle"></i>
        You do not need to enter the current ID or password. Saving will replace
        the existing owner credentials in the database.
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import {
        getDatabase,
        ref,
        update
    } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBpLcSFmn1gNTklHu2eiebDYtXpq0qIhlM",
        authDomain: "adey-bonda.firebaseapp.com",
        projectId: "adey-bonda",
        storageBucket: "adey-bonda.firebasestorage.app",
        messagingSenderId: "820555835547",
        appId: "1:820555835547:web:efc14ad017ab4d206f7e3e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const form = document.getElementById("settingsForm");
    const idInput = document.getElementById("idInput");
    const passwordInput = document.getElementById("passwordInput");
    const confirmPasswordInput = document.getElementById("confirmPasswordInput");
    const saveBtn = document.getElementById("saveBtn");

    const message = document.getElementById("message");
    const messageIcon = document.getElementById("messageIcon");
    const messageText = document.getElementById("messageText");

    function showMessage(text, type) {
        message.className = `message show ${type}`;
        messageIcon.className = type === "success"
            ? "fas fa-check-circle"
            : "fas fa-exclamation-circle";
        messageText.textContent = text;
    }

    document.querySelectorAll(".toggle-password").forEach(button => {
        button.addEventListener("click", () => {
            const input = document.getElementById(button.dataset.target);
            const icon = button.querySelector("i");

            if (input.type === "password") {
                input.type = "text";
                icon.className = "fas fa-eye-slash";
            } else {
                input.type = "password";
                icon.className = "fas fa-eye";
            }
        });
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const newId = idInput.value.trim();
        const newPassword = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        message.classList.remove("show");

        if (!newId || !newPassword || !confirmPassword) {
            showMessage("Please fill in all fields.", "error");
            return;
        }

        if (!/^\d+$/.test(newId)) {
            showMessage("Owner ID must contain numbers only.", "error");
            idInput.focus();
            return;
        }

        if (newPassword !== confirmPassword) {
            showMessage("The passwords do not match.", "error");
            confirmPasswordInput.focus();
            return;
        }

        saveBtn.classList.add("loading");
        saveBtn.disabled = true;

        try {
            await update(ref(db, "AdeyBonda/Owner"), {
                Id: newId,
                Password: newPassword
            });

            showMessage("Owner ID and password changed successfully.", "success");

            form.reset();

            setTimeout(() => {
                window.location.href = "home.html";
            }, 1200);

        } catch (error) {
            console.error("Failed to update owner credentials:", error);
            showMessage("Failed to change credentials. Please try again.", "error");
            saveBtn.classList.remove("loading");
            saveBtn.disabled = false;
        }
    });
</script>

</body>
</html>
